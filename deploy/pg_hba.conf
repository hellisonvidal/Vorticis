# Quem pode entrar no banco do Vorticis.
# Dentro do servidor (socket local): administração pelo docker exec.
# Por rede (inclusive o serviço de backup): SEMPRE com conexão segura (SSL) e senha (scram-sha-256).
# TYPE    DATABASE  USER  ADDRESS        METHOD
local     all       all                  trust
hostssl   all       all   0.0.0.0/0      scram-sha-256
hostssl   all       all   ::/0           scram-sha-256
