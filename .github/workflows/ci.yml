name: CI

on:
  push:
    branches: [main, "claude/**", "ccr-**", "frota-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VORTICIS_TEST_PG: Host=localhost;Username=postgres;Password=postgres;Database=postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Testes SQL das migrações
        run: |
          createdb -h localhost -U postgres vorticis_sql
          cat db/0*.sql db/tests/*.sql | psql -h localhost -U postgres -d vorticis_sql -v ON_ERROR_STOP=1 -q
      - name: Build
        run: dotnet build -c Release
      - name: Testes (.NET)
        run: dotnet test -c Release --no-build

  instalador-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Baixar PostgreSQL para Windows (binários oficiais)
        shell: pwsh
        run: ./instalador/baixar-postgresql.ps1 -Destino pgsql
      - name: Teste do banco local no Windows (initdb, start, migrações, stop)
        shell: pwsh
        env:
          VORTICIS_PG_EMBUTIDO_BIN: ${{ github.workspace }}\pgsql\bin
        run: |
          dotnet build tests/Vorticis.Infra.Tests -c Release
          tests/Vorticis.Infra.Tests/bin/Release/net10.0/Vorticis.Infra.Tests.exe -class Vorticis.Infra.Tests.ServidorEmbutidoTests -failSkips
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar os executáveis da suíte (arquivo único) com o PostgreSQL
        shell: pwsh
        run: |
          # Todos os módulos vão para a mesma pasta (publish), junto com a pasta pgsql: é a entrada do instalador.
          foreach ($projeto in "Vorticis.Desktop", "Vorticis.Fiscal.Desktop", "Vorticis.Folha.Desktop", "Vorticis.Escritorio.Desktop", "Vorticis.Erp.Desktop", "Vorticis.Condominio.Desktop", "Vorticis.Frota.Desktop") {
            dotnet publish "src/$projeto" -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Suite (referencia todos os módulos): publicada à parte, para não sobrescrever os executáveis dos módulos; só o exe dela vai para publish
          dotnet publish src/Vorticis.Suite.Desktop -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-suite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish-suite/VorticisSuite.exe publish
          # Vorticis Logística (programa único com as telas de Frota, Gerencial, Contábil, Fiscal e Folha): idem, só o exe dele
          dotnet publish src/Vorticis.Logistica.Desktop -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-logistica
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish-logistica/VorticisLogistica.exe publish
          Move-Item pgsql publish/pgsql
          # Visual C++ Redistributable 2015-2022 (x64): o instalador o instala em silêncio se faltar; vai também nos portáteis
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile publish/vc_redist.x64.exe -UseBasicParsing
          if ((Get-Item publish/vc_redist.x64.exe).Length -lt 10MB) { throw "vc_redist.x64.exe baixado está incompleto" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not (Test-Path "publish/pgsql/bin/$dll")) { throw "pgsql/bin sem $dll (runtime do Visual C++)" }
          }
          if (-not (Test-Path publish/pgsql/bin/initdb.exe)) { throw "pgsql/bin sem initdb.exe" }
          # Portáteis das suítes: os executáveis de cada produto numa pasta, com um único pgsql
          $produtos = @{
            "VorticisSuite" = "VorticisSuite", "VorticisEscritorio", "VorticisContabil", "VorticisFiscal", "VorticisFolha", "VorticisGerencial", "VorticisCondominio";
            "VorticisLogistica" = "VorticisLogistica"
          }
          foreach ($produto in $produtos.Keys) {
            New-Item -ItemType Directory -Path "portatil/$produto" -Force | Out-Null
            foreach ($exe in $produtos[$produto]) { Copy-Item "publish/$exe.exe" "portatil/$produto" }
            Copy-Item publish/pgsql "portatil/$produto/pgsql" -Recurse
            Copy-Item publish/vc_redist.x64.exe "portatil/$produto"
          }
      - name: Gerar instalador (Inno Setup)
        shell: pwsh
        run: |
          $versao = (Select-Xml -Path Directory.Build.props -XPath "//Version").Node.InnerText
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit 1 } }
          foreach ($iss in "instalador/Vorticis.iss", "instalador/VorticisLogistica.iss") {
            & $iscc "/DVersao=$versao" $iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem saida | Format-Table Name, @{n="MB"; e={[math]::Round($_.Length / 1MB, 1)}}
      - name: Teste de instalação (Windows limpo, sem configuração)
        shell: powershell
        run: |
          $setup = (Get-ChildItem saida/Setup-Vorticis-*.exe).FullName
          ./instalador/teste-instalacao.ps1 -Setup $setup
      - name: Teste de instalação do Vorticis Logística (Windows limpo, sem configuração)
        shell: powershell
        run: |
          # começa do zero, como numa transportadora que só instala o Vorticis Logística
          Remove-Item "$env:LOCALAPPDATA\Vorticis", "$env:APPDATA\Vorticis" -Recurse -Force -ErrorAction SilentlyContinue
          $setup = (Get-ChildItem saida/Setup-VorticisLogistica-*.exe).FullName
          ./instalador/teste-instalacao.ps1 -Setup $setup -Pasta "Programs\Vorticis Logistica" -Programa VorticisLogistica.exe -Arquivos VorticisLogistica.ico
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3   # apagados sozinhos em 3 dias (o armazenamento do GitHub é limitado)
          name: Setup-Vorticis
          path: saida/Setup-Vorticis-*.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3   # apagados sozinhos em 3 dias (o armazenamento do GitHub é limitado)
          name: Setup-VorticisLogistica
          path: saida/Setup-VorticisLogistica-*.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3   # apagados sozinhos em 3 dias (o armazenamento do GitHub é limitado)
          name: VorticisSuite-portatil
          path: portatil/VorticisSuite/
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 3   # apagados sozinhos em 3 dias (o armazenamento do GitHub é limitado)
          name: VorticisLogistica-portatil
          path: portatil/VorticisLogistica/
